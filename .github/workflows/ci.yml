name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Glibc 2.17 build
        run: ./scripts/package-release.sh 0.0.0-ci linux/amd64

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up C compiler
        shell: bash
        run: echo "C:/mingw64/bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build, load DLL and package
        shell: bash
        run: ./scripts/package-release.sh 0.0.0-ci windows/amd64
